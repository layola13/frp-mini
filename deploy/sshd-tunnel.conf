# /etc/ssh/sshd_config.d/tunnel.conf —— ssh -R 免客户端接入用（服务端一次性配置）
# 只允许 remote 转发（远端 -R 把 43110 映射到本机 127.0.0.1:14000+），不允许本地 -L 穿透出去
AllowTcpForwarding remote
GatewayPorts no
ClientAliveInterval 30
ClientAliveCountMax 3

# tunnel 用户：只能做 -R，不能 shell / sftp / 端口外露
Match User tunnel
  PasswordAuthentication no
  PermitTTY no
  X11Forwarding no
  AllowAgentForwarding no
  PermitTunnel no
  ForceCommand /bin/false
