# proxy.cxu.lol 独立入口:frp 专用,不碰 us.cxu.lol 主站 SPA
# 用法: 替换 server_name 下证书行(或改用 certbot/caddy), include 本文件后 nginx -t && nginx -s reload
server {
  listen 80;
  server_name proxy.cxu.lol;
  # HTTP-01 / 直接跳 https(证书就绪后)
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name proxy.cxu.lol;

  # TODO: 填入 proxy.cxu.lol 的证书(与 us.cxu.lol 主站证书分开,互不影响)
  # ssl_certificate     /etc/letsencrypt/live/proxy.cxu.lol/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/proxy.cxu.lol/privkey.pem;

  # frp server 跑在 127.0.0.1:8080(见 deploy/deploy-proxy.sh);全部路径透传,含 WS Upgrade
  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}
